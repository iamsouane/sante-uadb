global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alertes.yml

scrape_configs:
  # Les cibles ne sont pas écrites à la main : Prometheus les découvre dans Eureka.
  - job_name: services
    metrics_path: /actuator/prometheus
    basic_auth:
      username: supervision
      password_file: /run/secrets/supervision_password
    eureka_sd_configs:
      - server: http://eureka-server:8761/eureka
        refresh_interval: 5s
        basic_auth:
          username: eureka
          password_file: /run/secrets/eureka_password
    relabel_configs:
      - source_labels: [__meta_eureka_app_name]
        target_label: service
        action: lowercase
      - source_labels: [__meta_eureka_app_instance_id]
        target_label: instance_id

  - job_name: eureka
    metrics_path: /actuator/prometheus
    basic_auth:
      username: eureka
      password_file: /run/secrets/eureka_password
    static_configs:
      - targets: [eureka-server:8761]
        labels:
          service: eureka-server
