server {
    listen 8080;
    server_tokens off;
    root /usr/share/nginx/html;

    # Résolution à chaque requête : nginx démarre même si supervision-service est absent
    resolver 127.0.0.11 valid=5s;

    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location / {
        try_files $uri /index.html;
    }

    # Direct vers la supervision, sans passer par la passerelle : si elle tombe, l'écran doit
    # continuer d'afficher la panne.
    location /api/supervision/ {
        set $amont http://supervision-service:8090;
        proxy_pass $amont;
        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;
        proxy_set_header Host $host;
    }
}
