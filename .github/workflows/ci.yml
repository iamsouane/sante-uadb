name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  java:
    name: Tests Java (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Le binôme développe sous macOS et Windows : le build doit passer partout
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: ./mvnw -B verify
        shell: bash
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: couverture-jacoco
          path: "**/target/site/jacoco"

  front:
    name: Tableau de bord
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tableau-de-bord
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tableau-de-bord/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high

  conteneurs:
    name: Pile complète et scan
    needs: [java, front]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/init-env.sh > /dev/null
      - run: docker compose config -q
      - run: docker compose build
      - run: docker compose up -d --wait --wait-timeout 240
      - name: Essai de bout en bout (UP, panne, rétablissement)
        run: python3 scripts/verifier.py
      - name: Journaux en cas d'échec
        if: failure()
        run: docker compose ps && docker compose logs --tail 80
      - run: docker compose down -v
        if: always()
      # Action épinglée par empreinte : un tag peut être déplacé, pas un commit (v0.36.0)
      - name: Scan des fichiers (dépendances npm, configuration, secrets)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: fs
          scanners: vuln,misconfig,secret
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1
          # Les JAR sont analysés dans les images ci-dessous ; résoudre les POM sollicite Maven
          # Central au point de faire bloquer l'IP (429)
          skip-files: "**/pom.xml"
      - name: Scan de l'image eureka-server
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: sante-uadb/eureka-server
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1
      - name: Scan de l'image api-gateway
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: sante-uadb/api-gateway
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1
      - name: Scan de l'image catalogue-service
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: sante-uadb/catalogue-service
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1
      - name: Scan de l'image commande-service
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: sante-uadb/commande-service
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1
      - name: Scan de l'image supervision-service
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: sante-uadb/supervision-service
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1
      - name: Scan de l'image tableau-de-bord
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: sante-uadb/tableau-de-bord
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1
